services:
  postgres:
    image: postgres:19-alpine
    pull_policy: never
    container_name: flowpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      POSTGRES_DB: "${DB_DATABASE:?Set DB_DATABASE in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${DB_USERNAME} -d ${DB_DATABASE}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    pull_policy: never
    container_name: flowpro-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    ports:
      - "127.0.0.1:6432:5432"

volumes:
  postgres_data:
